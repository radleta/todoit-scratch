<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tidepool</title>
<style>
:root{
  --abyss:#06283D; --deep:#0B4F6C; --lagoon:#1B8A9A; --foam:#E6FBFF; --kelp:#7FD1AE; --coral:#FF9A7A;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--foam);
  font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:
    repeating-linear-gradient(105deg, rgba(230,251,255,.05) 0 40px, transparent 40px 140px),
    linear-gradient(180deg,#2AA6B5 0%, var(--lagoon) 12%, var(--deep) 45%, var(--abyss) 100%);
}
.wrap{max-width:980px; margin:0 auto; padding:28px 20px 48px}
header{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px}
h1{margin:0; font:italic 600 2.6rem/1 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; letter-spacing:.01em}
.tally{margin:0; color:var(--foam); opacity:.9}
.tally b{color:var(--coral); font-size:1.15em}
.mute{margin-left:auto; border:1px solid rgba(230,251,255,.45); background:rgba(6,40,61,.35); color:var(--foam);
  border-radius:999px; padding:8px 14px; font:inherit; cursor:pointer}
.mute::before{content:"\266B  "}
form{display:flex; gap:10px; margin:26px 0 16px}
input{flex:1; min-width:0; padding:14px 18px; border-radius:999px; border:2px solid rgba(230,251,255,.35);
  background:rgba(6,40,61,.55); color:var(--foam); font:inherit}
input::placeholder{color:rgba(230,251,255,.7)}
.add{padding:0 22px; border-radius:999px; border:0; background:var(--kelp); color:var(--abyss); font:700 1rem "Trebuchet MS",sans-serif; cursor:pointer}
:focus-visible{outline:3px solid var(--coral); outline-offset:3px}
.filters{display:flex; gap:8px; flex-wrap:wrap}
.filters button{border:0; background:transparent; color:var(--foam); font:inherit; padding:6px 14px; border-radius:999px; cursor:pointer}
.filters button[aria-pressed=true]{background:var(--foam); color:var(--abyss); font-weight:700}
.filters span{opacity:.75; margin-left:4px}
.layout{display:grid; grid-template-columns:1fr 260px; gap:28px; margin-top:22px}
.field{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:18px 22px; padding:20px 0 30px; min-height:360px}
.bubble{
  width:var(--s); height:var(--s); flex:none; border-radius:50%; display:grid; place-items:center; padding:calc(var(--s) * .18);
  text-align:center; color:var(--foam); font:inherit; font-size:.95rem; cursor:pointer;
  border:1.5px solid rgba(230,251,255,.6);
  background:
    radial-gradient(circle at 24% 20%, rgba(255,255,255,.7) 0 4%, rgba(255,255,255,0) 10%),
    radial-gradient(circle at 50% 50%, rgba(27,138,154,.25) 55%, rgba(230,251,255,.28) 100%);
  box-shadow: inset 0 -8px 18px rgba(127,209,174,.25), 0 6px 20px rgba(6,40,61,.4);
  text-shadow:0 1px 2px rgba(6,40,61,.8);
}
.bubble:nth-child(2){margin-bottom:90px}
.bubble:nth-child(3){margin-bottom:30px}
.bubble:nth-child(4){margin-bottom:120px}
.bubble:nth-child(5){margin-bottom:50px}
.hint{text-align:center; font-size:.9rem; opacity:.8; margin:0}
aside{display:flex; flex-direction:column; gap:20px}
.panel{border-radius:22px; padding:18px; background:rgba(6,40,61,.55); border:1px solid rgba(230,251,255,.18)}
.panel h2{margin:0 0 10px; font:italic 600 1.2rem "Palatino Linotype",Palatino,Georgia,serif}
.done{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.done li{display:flex; align-items:center; gap:10px}
.done li::before{content:""; flex:none; width:16px; height:16px; border-radius:50%; border:1.5px dashed var(--kelp)}
.done s{flex:1; text-decoration-color:var(--kelp); opacity:.85}
.restore{border:1px solid rgba(230,251,255,.4); background:none; color:var(--foam); border-radius:999px; font:inherit; font-size:.8rem; padding:3px 10px; cursor:pointer}
.empty{text-align:center; padding:26px 10px 18px; background:linear-gradient(180deg, rgba(42,166,181,.25), rgba(6,40,61,.6))}
.empty .ripple{width:90px; height:22px; margin:0 auto 14px; border-radius:50%; border:1.5px solid rgba(230,251,255,.5); box-shadow:0 0 0 10px rgba(230,251,255,.08), 0 0 0 22px rgba(230,251,255,.04)}
.empty p{margin:0 0 4px}
.empty small{opacity:.8}
.caption{font-size:.75rem; opacity:.7; margin:0 0 8px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .field{min-height:0}
  .bubble:nth-child(n){margin-bottom:0}
  h1{font-size:2.1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tidepool</h1>
    <p class="tally"><b>128</b> bubbles have reached the surface</p>
    <button class="mute" aria-pressed="false">Sea sounds on</button>
  </header>

  <form onsubmit="return false">
    <input aria-label="New todo" placeholder="Let a task float up from the deep">
    <button class="add">Release</button>
  </form>

  <nav class="filters" aria-label="Filter todos">
    <button aria-pressed="true">All<span>8</span></button>
    <button aria-pressed="false">Drifting<span>5</span></button>
    <button aria-pressed="false">Surfaced<span>3</span></button>
  </nav>

  <div class="layout">
    <main>
      <div class="field">
        <button class="bubble" style="--s:150px">Water plants</button>
        <button class="bubble" style="--s:190px">Fix the squeaky hinge on the back door</button>
        <button class="bubble" style="--s:140px">Buy oat milk</button>
        <button class="bubble" style="--s:230px">Write the quarterly report intro and send it to Dana for a first read</button>
        <button class="bubble" style="--s:160px">Call the dentist</button>
      </div>
      <p class="hint">Tap a bubble to pop it at the surface.</p>
    </main>
    <aside>
      <section class="panel">
        <h2>Surfaced</h2>
        <ul class="done">
          <li><s>Pay rent</s><button class="restore">Sink back</button></li>
          <li><s>Return library books</s><button class="restore">Sink back</button></li>
          <li><s>Reply to Sam about Saturday</s><button class="restore">Sink back</button></li>
        </ul>
      </section>
      <div>
        <p class="caption">Empty state</p>
        <section class="panel empty">
          <div class="ripple"></div>
          <p>Still water.</p>
          <small>Release a task and watch it rise.</small>
        </section>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
