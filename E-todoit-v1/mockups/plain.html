<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plain</title>
<style>
:root{
  --paper:#EEF0F3; --graphite:#22262E; --blue:#2F5BEA; --yellow:#F4C430; --red:#C8402A; --green:#1F7A50; --rule:#C9CED6;
}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:var(--paper); color:var(--graphite);
  font:16px/1.45 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
.wrap{max-width:1040px; margin:0 auto; padding:32px 20px 48px; display:grid; grid-template-columns:240px 1fr; gap:40px}
.side{display:flex; flex-direction:column; gap:22px}
h1{margin:0; font:700 2.4rem/1 "Franklin Gothic Medium","Arial Narrow","Helvetica Neue",Arial,sans-serif; letter-spacing:-.03em}
h1 i{display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red); margin-left:4px}
.tally{margin:0; border-top:2px solid var(--graphite); padding-top:10px}
.tally b{font-size:1.6rem; display:block; line-height:1.1}
.filters{display:grid; gap:2px}
.filters button{display:flex; justify-content:space-between; border:0; background:transparent; color:var(--graphite); font:inherit; padding:8px 10px; cursor:pointer; text-align:left}
.filters button[aria-pressed=true]{background:var(--graphite); color:#fff}
.mute{align-self:flex-start; border:2px solid var(--graphite); background:transparent; color:var(--graphite); padding:6px 12px; font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
form{display:flex; border-bottom:3px solid var(--graphite)}
input{flex:1; min-width:0; padding:12px 0; border:0; background:transparent; color:var(--graphite); font:inherit; font-size:1.25rem}
input::placeholder{color:#5D6470}
.add{border:0; background:var(--blue); color:#fff; font:inherit; font-weight:700; padding:0 22px; cursor:pointer}
.field{display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:34px 0 10px}
.dot{width:var(--s); height:var(--s); flex:none; border-radius:50%; display:grid; place-items:center; padding:calc(var(--s) * .16);
  text-align:center; font:inherit; font-weight:700; font-size:.95rem; border:0; cursor:pointer; background:var(--c); color:var(--t,#fff)}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:26px}
h2{margin:0 0 8px; font-size:1rem; border-top:2px solid var(--graphite); padding-top:8px}
.done{list-style:none; margin:0; padding:0}
.done li{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule)}
.done li::before{content:""; flex:none; width:14px; height:14px; border-radius:50%; border:2px solid var(--graphite)}
.done s{flex:1; color:#4A505B}
.restore{border:0; background:none; color:var(--blue); font:inherit; font-size:.9rem; text-decoration:underline; cursor:pointer}
.empty{display:flex; align-items:center; gap:16px; padding:16px; background:#fff}
.empty .ring{flex:none; width:56px; height:56px; border-radius:50%; border:3px solid var(--rule)}
.empty p{margin:0}
.caption{font-size:.75rem; color:#4A505B; margin:0 0 6px}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr; gap:22px}
  .side{display:grid; grid-template-columns:1fr auto; align-items:end}
  .filters{grid-column:1/-1; grid-template-columns:repeat(3,1fr)}
  .tally{grid-column:1/-1}
  .cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h1>todoit<i></i></h1>
    <button class="mute" aria-pressed="false">Sound on</button>
    <p class="tally"><b>128</b>popped, all time</p>
    <nav class="filters" aria-label="Filter todos">
      <button aria-pressed="true"><span>All</span><span>8</span></button>
      <button aria-pressed="false"><span>Active</span><span>5</span></button>
      <button aria-pressed="false"><span>Done</span><span>3</span></button>
    </nav>
  </div>

  <main>
    <form onsubmit="return false">
      <input aria-label="New todo" placeholder="Add a todo">
      <button class="add">Add</button>
    </form>
    <div class="field">
      <button class="dot" style="--s:200px;--c:var(--blue)">Write the quarterly report intro and send it to Dana for a first read</button>
      <button class="dot" style="--s:120px;--c:var(--yellow);--t:var(--graphite)">Buy oat milk</button>
      <button class="dot" style="--s:165px;--c:var(--red)">Fix the squeaky hinge on the back door</button>
      <button class="dot" style="--s:130px;--c:var(--graphite)">Call the dentist</button>
      <button class="dot" style="--s:115px;--c:var(--green)">Water plants</button>
    </div>
    <div class="cols">
      <section>
        <h2>Done</h2>
        <ul class="done">
          <li><s>Pay rent</s><button class="restore">Restore</button></li>
          <li><s>Return library books</s><button class="restore">Restore</button></li>
          <li><s>Reply to Sam about Saturday</s><button class="restore">Restore</button></li>
        </ul>
      </section>
      <section>
        <p class="caption">Empty state</p>
        <div class="empty">
          <div class="ring"></div>
          <p>Nothing to do. Add a todo above and it shows up here as a circle.</p>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
